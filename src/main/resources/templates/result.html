<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예외 발생 결과</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .content {
            padding: 2rem;
        }

        .result-card {
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid;
        }

        .success {
            color: #155724;
            background-color: #d4edda;
            border-color: #28a745;
            border-left-color: #28a745;
        }

        .success h3 {
            color: #155724;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .success h3::before {
            content: "✅";
            font-size: 1.2rem;
        }

        .error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #dc3545;
            border-left-color: #dc3545;
        }

        .error h3 {
            color: #721c24;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .error h3::before {
            content: "❌";
            font-size: 1.2rem;
        }

        .test-info, .exception-info {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .test-detail, .exception-detail {
            display: flex;
            margin-bottom: 0.5rem;
        }

        .test-detail strong, .exception-detail strong {
            min-width: 120px;
            color: #495057;
        }

        .test-detail span, .exception-detail span {
            color: #dc3545;
            font-weight: 500;
        }

        .success-info {
            background: #ffffff;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
        }

        .success-info .note {
            color: #856404;
            font-style: italic;
            margin-top: 0.5rem;
        }

        .stack-trace {
            margin-top: 1rem;
        }

        .stack-trace-header {
            color: #495057;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 12px 24px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-button::before {
            content: "←";
            font-weight: bold;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        .back-button:active {
            transform: translateY(0);
        }
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        max-height: 400px;
        overflow-y: auto;
        }

        .trace-line {
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid #e9ecef;
            padding: 0.5rem;
        }

        .trace-line:last-child {
            border-bottom: none;
        }

        .trace-line:hover {
            background-color: #e3f2fd;
        }

        .line-number {
            background: #6c757d;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
            min-width: 30px;
            text-align: center;
            margin-right: 0.5rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .trace-text {
            margin: 0;
            color: #e83e8c;
            line-height: 1.4;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.85rem;
            flex: 1;
            word-break: break-all;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .retry-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 12px 24px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .retry-button::before {
            content: "🔄";
        }

        .retry-button:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 1.5rem;
            }

            .exception-detail {
                flex-direction: column;
                gap: 0.25rem;
            }

            .exception-detail strong {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧪 예외 발생 테스트 결과</h1>
    </div>

    <div class="content">
        <!-- 예외 발생 결과 표시 (주요 케이스) -->
        <div th:if="${exception != null}" class="result-card error">
            <h3>예외 테스트 결과</h3>

            <div class="test-info">
                <div class="test-detail">
                    <strong>테스트 결과:</strong>
                    <span th:text="${result}">예외가 발생했습니다.</span>
                </div>
            </div>

            <div class="exception-info">
                <div class="exception-detail">
                    <strong>예외 타입:</strong>
                    <span th:text="${exceptionType}">ExceptionType</span>
                </div>

                <div class="exception-detail">
                    <strong>예외 메시지:</strong>
                    <span th:text="${exceptionMessage}">Exception message</span>
                </div>

                <div class="exception-detail" th:if="${exceptionCause != null}">
                    <strong>원인:</strong>
                    <span th:text="${exceptionCause}">Cause</span>
                </div>
            </div>

            <!-- 스택 트레이스 표시 -->
            <div th:if="${stackTraceList != null and !#lists.isEmpty(stackTraceList)}" class="stack-trace">
                <div class="stack-trace-header">📋 상세 스택 트레이스</div>
                <div class="stack-trace-content">
                    <div th:each="trace, iterStat : ${stackTraceList}" class="trace-line">
                        <span class="line-number" th:text="${iterStat.count}">1</span>
                        <pre th:text="${trace}" class="trace-text">스택 트레이스 라인</pre>
                    </div>
                </div>
            </div>
        </div>

        <!-- 예외가 발생하지 않은 경우 (드물지만 가능) -->
        <div th:if="${exception == null}" class="result-card success">
            <h3>테스트 완료</h3>
            <div class="success-info">
                <p><strong>결과:</strong> <span th:text="${result}">예외 테스트가 성공적으로 완료되었습니다.</span></p>
                <p class="note">⚠️ 예외가 발생하지 않았습니다. 테스트 로직을 확인해주세요.</p>
            </div>
        </div>

        <div class="action-buttons">
            <a href="/index" class="back-button">테스트 목록으로 돌아가기</a>
            <button onclick="window.location.reload()" class="retry-button">다시 실행</button>
        </div>
    </div>
</div>
</body>
</html>
